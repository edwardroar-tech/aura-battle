<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Aura Battle</title>
<style>
body{margin:0;background:#090b18;color:white;font:16px Arial;text-align:center}
h1{font-size:40px;text-shadow:0 0 20px #9d7cff}
.box{max-width:1000px;margin:auto;padding:15px}
.panel,.card{background:#12162a;border:1px solid #363c68;border-radius:18px;padding:15px;margin:10px}
.arena{display:grid;grid-template-columns:1fr 60px 1fr;gap:10px}
.vs{align-self:center;font-size:28px;color:#ffd24d;font-weight:bold}
video{width:100%;aspect-ratio:4/3;background:#000;border-radius:12px;object-fit:cover}
.score{font-size:42px;font-weight:bold}
button,input{padding:12px;margin:5px;border:0;border-radius:9px;font-size:16px}
button{background:#7657ff;color:#fff;font-weight:bold}
@media(max-width:700px){.arena{grid-template-columns:1fr}.vs{font-size:20px}}
</style>
</head>

<body>
<h1>⚡ AURA BATTLE ⚡</h1>

<div class="box">

<div class="panel">
<button id="create">CREAR SALA</button>
<input id="room" placeholder="CÓDIGO">
<button id="join">UNIRME</button>
<div id="code"></div>
<div id="status">Crea una sala o únete a una.</div>
</div>

<div class="arena">

<div class="card">
<b>JUGADOR 1</b>
<video id="local" autoplay muted playsinline></video>
<div class="score" id="s1">50</div>
</div>

<div class="vs">VS</div>

<div class="card">
<b>JUGADOR 2</b>
<video id="remote" autoplay playsinline></video>
<div class="score" id="s2">50</div>
</div>

</div>

<button id="cam">📹 ACTIVAR CÁMARA</button>
<button id="battle" disabled>🔥 COMENZAR BATALLA</button>

<h2 id="result"></h2>

</div>

<script src="/socket.io/socket.io.js"></script>

<script>
const socket=io();
let pc=null;
let stream=null;

const $=x=>document.getElementById(x);

async function activarCamara(){

try{

stream=await navigator.mediaDevices.getUserMedia({
video:true,
audio:false
});

$("local").srcObject=stream;

crearConexion();

$("status").textContent="📹 Cámara activada. Esperando rival...";

}catch(e){

$("status").textContent=
"❌ No se pudo acceder a la cámara. Permite el acceso.";

}

}

function crearConexion(){

if(pc)return;

pc=new RTCPeerConnection({

iceServers:[
{urls:"stun:stun.l.google.com:19302"}
]

});

stream.getTracks().forEach(track=>{
pc.addTrack(track,stream);
});

pc.ontrack=e=>{
$("remote").srcObject=e.streams[0];
};

pc.onicecandidate=e=>{

if(e.candidate){

socket.emit("signal",{
candidate:e.candidate
});

}

};

}

$("create").onclick=()=>{

socket.emit("create",codigo=>{

$("code").textContent="⚡ CÓDIGO: "+codigo;

$("status").textContent=
"Comparte este código con tu rival.";

});

};

$("join").onclick=()=>{

const codigo=$("room").value.trim();

socket.emit("join",codigo,res=>{

if(res.ok){

$("code").textContent="SALA: "+codigo.toUpperCase();

$("status").textContent=
"Entraste a la sala. Activa tu cámara.";

}else{

$("status").textContent="❌ "+res.error;

}

});

};

$("cam").onclick=activarCamara;

socket.on("peer-joined",async()=>{

crearConexion();

const oferta=await pc.createOffer();

await pc.setLocalDescription(oferta);

socket.emit("signal",{
offer:pc.localDescription
});

$("battle").disabled=false;

$("status").textContent=
"🔥 ¡RIVAL CONECTADO!";

});

socket.on("signal",async mensaje=>{

crearConexion();

if(mensaje.offer){

await pc.setRemoteDescription(mensaje.offer);

const respuesta=await pc.createAnswer();

await pc.setLocalDescription(respuesta);

socket.emit("signal",{
answer:pc.localDescription
});

}

if(mensaje.answer){

await pc.setRemoteDescription(mensaje.answer);

}

if(mensaje.candidate){

await pc.addIceCandidate(
mensaje.candidate
).catch(()=>{});

}

});

$("battle").onclick=()=>{

socket.emit("start");

};

socket.on("start",()=>{

let aura1=50;
let aura2=50;
let tiempo=10;

$("result").textContent=
"⚡ ¡3... 2... 1... AURA!";

const batalla=setInterval(()=>{

aura1=Math.max(
0,
Math.min(100,
aura1+Math.round(Math.random()*20-10)
)
);

aura2=Math.max(
0,
Math.min(100,
aura2+Math.round(Math.random()*20-10)
)
);

$("s1").textContent=aura1;
$("s2").textContent=aura2;

tiempo--;

if(tiempo<0){

clearInterval(batalla);

if(aura1===aura2){

$("result").textContent="🤝 ¡EMPATE DE AURA!";

}else if(aura1>aura2){

$("result").textContent=
"🏆 ¡GANA JUGADOR 1!";

}else{

$("result").textContent=
"🏆 ¡GANA JUGADOR 2!";

}

}

},1000);

});

</script>
</body>
</html>
