<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Aura Battle</title>
<style>body{margin:0;background:#090b18;color:white;font:16px Arial;text-align:center}h1{font-size:40px;text-shadow:0 0 20px #9d7cff}.box{max-width:1000px;margin:auto;padding:15px}.panel,.card{background:#12162a;border:1px solid #363c68;border-radius:18px;padding:15px;margin:10px}.arena{display:grid;grid-template-columns:1fr 60px 1fr;gap:10px}.vs{align-self:center;font-size:28px;color:#ffd24d;font-weight:bold}video{width:100%;aspect-ratio:4/3;background:#000;border-radius:12px;object-fit:cover}.score{font-size:42px;font-weight:bold}button,input{padding:12px;margin:5px;border:0;border-radius:9px;font-size:16px}button{background:#7657ff;color:#fff;font-weight:bold}.code{font-size:25px;letter-spacing:4px;margin:10px}@media(max-width:700px){.arena{grid-template-columns:1fr}.vs{font-size:20px}}</style>
<body><h1>⚡ AURA BATTLE ⚡</h1><div class="box"><div class="panel"><button id="create">CREAR SALA</button><input id="room" placeholder="CÓDIGO"><button id="join">UNIRME</button><div id="code" class="code"></div><div id="status">Crea una sala o únete a una.</div></div>
<div class="arena"><div class="card"><b>JUGADOR 1</b><video id="local" autoplay muted playsinline></video><div class="score" id="s1">50</div></div><div class="vs">VS</div><div class="card"><b>JUGADOR 2</b><video id="remote" autoplay playsinline></video><div class="score" id="s2">50</div></div></div>
<button id="cam">📹 ACTIVAR CÁMARA</button><button id="battle" disabled>🔥 COMENZAR BATALLA</button><h2 id="result"></h2></div>
<script src="/socket.io/socket.io.js"></script><script>
const ioClient=io();let pc,stream,room;
const $=x=>document.getElementById(x);
async function cam(){stream=await navigator.mediaDevices.getUserMedia({video:true,audio:false});$('local').srcObject=stream;setup();$('status').textContent='Cámara activa.'}
function setup(){if(pc)return;pc=new RTCPeerConnection({iceServers:[{urls:'stun:stun.l.google.com:19302'}]});stream.getTracks().forEach(t=>pc.addTrack(t,stream));pc.ontrack=e=>$('remote').srcObject=e.streams[0];pc.onicecandidate=e=>e.candidate&&ioClient.emit('signal',{candidate:e.candidate})}
$('create').onclick=()=>ioClient.emit('create',c=>{$('code').textContent='CÓDIGO: '+c;room=c;$('status').textContent='Comparte el código con tu rival.'});
$('join').onclick=()=>ioClient.emit('join',$('room').value,r=>{$('status').textContent=r.ok?'Entraste a la sala. Activa tu cámara.':r.error});
$('cam').onclick=cam;
ioClient.on('peer-joined',async()=>{setup();let o=await pc.createOffer();await pc.setLocalDescription(o);ioClient.emit('signal',{offer:pc.localDescription});$('battle').disabled=false;$('status').textContent='¡Rival conectado!'});
ioClient.on('signal',async m=>{setup();if(m.offer){await pc.setRemoteDescription(m.offer);let a=await pc.createAnswer();await pc.setLocalDescription(a);ioClient.emit('signal',{answer:pc.localDescription})}if(m.answer)await pc.setRemoteDescription(m.answer);if(m.candidate)await pc.addIceCandidate(m.candidate).catch(()=>{})});
$('battle').onclick=()=>ioClient.emit('start');ioClient.on('start',()=>{let a=50,b=50,t=10;$('result').textContent='⚡ ¡AURA!';let x=setInterval(()=>{a=Math.max(0,Math.min(100,a+Math.round(Math.random()*20-10)));b=Math.max(0,Math.min(100,b+Math.round(Math.random()*20-10)));$('s1').textContent=a;$('s2').textContent=b;if(--t<0){clearInterval(x);$('result').textContent=a==b?'🤝 EMPATE':a>b?'🏆 GANA JUGADOR 1':'🏆 GANA JUGADOR 2'}},1000)});
</script></body></html>
